<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000"><title>Chat preferences</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fafafa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:480px;margin:auto;min-height:100svh;display:flex;flex-direction:column}header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(15px + env(safe-area-inset-top)) 24px 0;height:auto;min-height:64px}nav{display:flex;gap:5px}nav i{height:4px;width:34px;background:#29292e;border-radius:8px}nav i.on{background:#777bff}button{font:inherit;color:inherit;cursor:pointer}#back{justify-self:start;width:44px;height:44px;border:0;background:none;font-size:26px}#back:disabled{opacity:.32;cursor:default}#skip{justify-self:end;border:1px solid #323236;background:none;border-radius:99px;padding:9px 17px;font-size:14px}section{padding:clamp(30px,7vh,70px) 24px 32px}h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;text-align:center;font-size:clamp(31px,8vw,43px);letter-spacing:-.055em;line-height:1.08;margin:0 0 32px;text-wrap:balance}.options{display:grid;gap:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.option{display:grid;gap:16px;min-width:0;padding:0;border:0;background:none;text-align:center;font-weight:600;font-size:clamp(14px,4vw,18px)}
.option-frame{display:block;position:relative;overflow:hidden;height:72px;border-radius:60px;background:linear-gradient(120deg,#282840,#151517)}
.option-frame img{display:block;width:100%;height:100%;object-fit:cover}
.gender-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px;align-items:start}
.gender-grid .option{width:72%;justify-self:center}
.gender-grid .option-frame{height:auto;aspect-ratio:3/4;border-radius:999px}
.gender-grid .option:nth-child(2){grid-column:2;grid-row:1/span 2;align-self:center;width:88%}
.gender-grid .option:nth-child(2) .option-frame{aspect-ratio:4/5}
.gender-grid .option:nth-child(3){grid-column:1;grid-row:2;width:61%}
.story .option-frame,.art .option-frame{height:auto;aspect-ratio:1}
.story .option-frame{border-radius:17px}.art .option-frame{border-radius:50%}
.option[aria-pressed=true] .option-frame{outline:2px solid #fff;outline-offset:4px}
.option[aria-pressed=true] .option-label{color:#fff}
footer{margin-top:auto;position:sticky;bottom:0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:transparent;z-index:2}#next{height:48px;border:0;background:#4C52FF;width:100%;border-radius:12px;font-weight:650}button:focus-visible{outline:3px solid white;outline-offset:3px}.message{font-size:14px;color:#c4c4d0}
.stage{position:relative;overflow:hidden}.outgoing{position:absolute;inset:0 0 auto;pointer-events:none}
.starfield{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#020208}
.cosmos{position:absolute;top:0;left:0;width:168%;height:168%;transform:translate(var(--view-x,-4%),var(--view-y,-5%));transition:transform 1000ms cubic-bezier(.22,1,.36,1)}
.nebula{position:absolute;inset:0;filter:hue-rotate(var(--nebula-hue,0deg)) saturate(1.45);transition:filter 1000ms ease;
background:
 radial-gradient(ellipse 31% 18% at 24% 24%,#784c9e38 0%,#3d226c31 42%,transparent 100%),
 radial-gradient(ellipse 27% 26% at 65% 30%,#18478053 0%,#111b4938 55%,transparent 100%),
 radial-gradient(ellipse 30% 19% at 31% 67%,#5142a047 0%,#21184348 50%,transparent 100%),
 radial-gradient(ellipse 33% 22% at 74% 70%,#85366b38 0%,#411c5942 47%,transparent 100%)}
.nebula::before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse 15% 6% at 27% 25%,#ae71a52c,transparent 100%),
 radial-gradient(ellipse 16% 8% at 62% 36%,#5e8bcc38,transparent 100%),
 radial-gradient(ellipse 22% 9% at 38% 67%,#7662d036,transparent 100%),
 radial-gradient(ellipse 17% 10% at 72% 74%,#a24c8538,transparent 100%);filter:blur(16px)}
.cosmos[data-view="1"]{--view-x:-14%;--view-y:-6%;--nebula-hue:-55deg}
.cosmos[data-view="2"]{--view-x:-24%;--view-y:-7%;--nebula-hue:48deg}
.cosmos[data-view="3"]{--view-x:-34%;--view-y:-8%;--nebula-hue:110deg}
@media(prefers-reduced-motion:reduce){.cosmos,.nebula{transition:none}}
.star{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:var(--color);opacity:.45;box-shadow:0 0 5px var(--color);animation:twinkle var(--duration) ease-in-out var(--delay) infinite}
@keyframes twinkle{0%,25%{opacity:.08;transform:scale(.7)}66%{opacity:.55}82%{opacity:1;transform:scale(1.55)}100%{opacity:.3;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){.star{animation:none}}
main{position:relative}
.warp{position:fixed;inset:0;z-index:5;width:100%;height:100%;background:#000}
main[hidden]{display:none}
.gender-grid .option{transition:opacity 180ms ease-out}
.gender-grid:has(.option[aria-pressed="true"]) .option[aria-pressed="false"]{opacity:.45}
@media(prefers-reduced-motion:reduce){.gender-grid .option{transition:none}}
#restart{height:48px;width:100%;border:0;border-radius:12px;background:#4C52FF;font-weight:650}
.story-grid{row-gap:30px}
.story .option-frame{width:81%;justify-self:center;rotate:var(--tilt)}
.art{align-self:start;grid-template-rows:auto auto;align-content:start;width:var(--option-width);justify-self:center;translate:var(--offset-x) var(--offset-y)}
.stage{flex:1;display:flex;flex-direction:column}
.stage section{flex:1;display:flex;flex-direction:column;padding-bottom:0}
.stage h1{margin-bottom:0}
.stage .options-window{margin-block:auto}.stage .options{padding-block:16px}
.stage .message{position:absolute;inset:auto 24px 0;margin:0}
.stage .outgoing{height:100%;inset:0}
main:has(.story-grid){height:100svh}
.stage:has(.story-grid),section:has(.story-grid){min-height:0}
.stage .options-window:has(.story-grid){position:relative;flex:1;min-height:0;margin:24px -10px 0;overflow:hidden;mask-image:linear-gradient(to bottom,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.options-window:has(.story-grid)::before,.options-window:has(.story-grid)::after{content:"";position:absolute;z-index:1;left:0;right:0;height:18px;pointer-events:none;backdrop-filter:blur(4px)}
.options-window:has(.story-grid)::before{top:0;mask-image:linear-gradient(#000,transparent)}
.options-window:has(.story-grid)::after{bottom:0;mask-image:linear-gradient(transparent,#000)}
.stage .story-grid{height:100%;overflow-y:auto;overscroll-behavior:contain;align-content:start;padding:24px 10px;scrollbar-width:none}
.story-grid::-webkit-scrollbar{display:none}
</style>
<div class="starfield" aria-hidden="true"><div class="cosmos"><div class="nebula"></div></div></div><main><header><button id="back" aria-label="Back">←</button><nav aria-label="Progress"></nav><button id="skip">Skip</button></header><div class="stage"><section><h1 tabindex="-1"></h1><div class="options-window"><div id="options" class="options"></div></div><p role="status" id="message" class="message"></p></section></div><footer><button id="next">Continue</button></footer></main><main id="page-four" aria-label="Page 4" tabindex="-1" hidden><footer><button id="restart">Back to Step 1</button></footer></main><canvas class="warp" aria-hidden="true" hidden></canvas>
<script>
const cosmos=document.querySelector('.cosmos');
const stars=document.createDocumentFragment();
const starColors=['#ffffff','#acbaff','#c8b7ff'];
for(let index=0;index<230;index++){
 const star=document.createElement('span');
 star.className='star';
 star.style.left=Math.random()*100+'%';
 star.style.top=Math.random()*100+'%';
 star.style.setProperty('--size',(index%13===0?2.5:1+Math.random())+'px');
 star.style.setProperty('--color',starColors[index%starColors.length]);
 star.style.setProperty('--duration',(1.4+Math.random()*3.6)+'s');
 star.style.setProperty('--delay',(-Math.random()*7)+'s');
 stars.append(star);
}
cosmos.append(stars);

const pages=[
 ['What gender are you into chatting with?',['Male','Female','Everyone']],
 ['What type of stories are you into?',['#Romance','#Adventure','#Paranormal','#LGBT+','#Fantasy','#Sci-Fi','#Mystery','#Comedy','#Drama','#Horror']],
 ['What kind of art style are you into?',['#3D','#Realistic','#Semi-realistic','#Anime']]
];
const photos=[[10,64,65],[22,29,15,47,24,28,33,40,42,54],[48,100,164,237]];
const storyTilts=pages[1][1].map((_,index)=>
 (1+Math.random()*2)*(index%2===0?-1:1));
const artLayouts=[
 {width:98,x:-8,y:-6},
 {width:77,x:12,y:13},
 {width:73,x:10,y:9},
 {width:93,x:-6,y:-10}
].map(layout=>({
 width:layout.width+Math.random()*2,
 x:layout.x+Math.random()*3-1.5,
 y:layout.y+Math.random()*4-2
}));
const selected=[new Set(),new Set(),new Set()];
const get=id=>document.getElementById(id);
const heading=document.querySelector('h1'),nav=document.querySelector('nav'),options=get('options'),skip=get('skip'),next=get('next'),message=get('message');
let step=0;
function draw(){
 cosmos.dataset.view=step;
 const [title,labels]=pages[step];
 heading.textContent=title;
 nav.setAttribute('aria-label','Step '+(step+1)+' of 3');
 nav.innerHTML=pages.map((_,i)=>'<i class="'+(i<=step?'on':'')+'"></i>').join('');
 get('back').disabled=step===0;
 skip.hidden=step===2;
 next.textContent=step===2?'Confirm':'Continue';
 options.className=['options gender-grid','options grid story-grid','options grid'][step];
 options.replaceChildren();
 labels.forEach((label,i)=>{
  const button=document.createElement('button');
  button.className='option '+['','story','art'][step];
  if(step===1)button.style.setProperty('--tilt',storyTilts[i]+'deg');
  if(step===2){
   const layout=artLayouts[i];
   button.style.setProperty('--option-width',layout.width+'%');
   button.style.setProperty('--offset-x',layout.x+'px');
   button.style.setProperty('--offset-y',layout.y+'px');
  }
  const frame=document.createElement('span');
  frame.className='option-frame';
  const image=new Image();
  image.alt='';
  image.decoding='async';
  image.addEventListener('error',()=>image.remove(),{once:true});
  image.src='https://picsum.photos/id/'+photos[step][i]+(step===0?'/360/480':'/480/480');
  frame.append(image);
  const caption=document.createElement('span');
  caption.className='option-label';
  caption.textContent=label;
  button.append(frame,caption);
  button.setAttribute('aria-pressed',selected[step].has(label));
  button.onclick=()=>{
   const group=selected[step];
   const wasSelected=group.has(label);
   if(step===0){
    group.clear();
    group.add(label);
   }else if(group.has(label)){
    group.delete(label);
   }else{
    group.add(label);
   }
   Array.from(options.children).forEach((b,j)=>b.setAttribute('aria-pressed',group.has(labels[j])));
   if(!wasSelected && group.has(label) && typeof button.animate==='function'
       && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    button.getAnimations().filter(animation=>animation.id==='selection-pop')
     .forEach(animation=>animation.cancel());
    button.animate([
     {scale:'1',easing:'cubic-bezier(.2,.75,.3,1)'},
     {scale:'1.065',offset:.42},
     {scale:'.99',offset:.75},
     {scale:'1'}
    ],{id:'selection-pop',duration:340,easing:'ease-out'});
   }
   message.textContent='';next.textContent=step===2?'Confirm':'Continue';
  };
  options.append(button);
 });
 message.textContent='';
}
const panel=heading.closest('section');
let switching=false;
async function goToStep(target){
 if(switching || target===step || !pages[target])return;
 const direction=target>step?1:-1;
 const animated=typeof panel.animate==='function' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const previous=animated?panel.cloneNode(true):null;
 if(previous){
  switching=true;
  previous.classList.add('outgoing');
  previous.inert=true;
  previous.setAttribute('aria-hidden','true');
  previous.querySelectorAll('[id]').forEach(node=>node.removeAttribute('id'));
  panel.after(previous);
 }
 step=target;
 draw();
 window.scrollTo(0,0);
 if(previous){
  const distance=panel.getBoundingClientRect().width*direction;
  const easing='cubic-bezier(.22,1,.36,1)';
  const animations=[];
  for(const [index, incoming] of Array.from(panel.children).entries()){
   const duration=incoming===heading?650:820;
   const timing={duration,easing,fill:'both'};
   const slide=(node,start,end)=>node.animate([
    {transform:'translateX('+start+'px)'},
    {transform:'translateX('+end+'px)'}
   ],timing);
   animations.push(slide(previous.children[index],0,-distance),slide(incoming,distance,0));
  }
  try{await Promise.allSettled(animations.map(animation=>animation.finished))}
  finally{
   previous.remove();
   animations.forEach(animation=>animation.cancel());
   switching=false;
  }
 }
 heading.focus({preventScroll:true});
}
get('back').onclick=()=>{if(step>0)goToStep(step-1)};
skip.onclick=()=>{if(switching)return;selected[step].clear();goToStep(step+1)};
function enterPageFour(){
 switching=true;
 cosmos.dataset.view=3;
 const canvas=document.querySelector('.warp');
 const source=next.closest('main');
 const destination=get('page-four');
 const reveal=()=>{
  source.hidden=true;
  destination.hidden=false;
 };
 const finish=()=>{
  reveal();
  canvas.hidden=true;
  canvas.style.opacity='';
  destination.inert=false;
  destination.focus();
 };
 const context=canvas.getContext('2d');
 if(!context || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  finish();
  return;
 }
 canvas.hidden=false;
 const width=canvas.width=window.innerWidth;
 const height=canvas.height=window.innerHeight;
 const reach=Math.hypot(width,height)/2;
 const particles=Array.from({length:200},()=>({
  angle:Math.random()*Math.PI*2,
  phase:Math.random(),
  size:.6+Math.random()*1.6
 }));
 const clouds=[
  {x:-.19,y:-.13,size:.45,color:'94,69,185'},
  {x:.20,y:.15,size:.42,color:'31,90,159'},
  {x:.13,y:-.26,size:.30,color:'161,63,129'}
 ];
 const start=performance.now();
 function render(now){
  const time=Math.min((now-start)/2000,1);
  if(time===1){finish();return}
  const fade=Math.max(0,(time-.75)/.25);
  const easedFade=fade*fade*(3-2*fade);
  if(fade>0){
   if(destination.hidden){
    destination.inert=true;
    reveal();
   }
   canvas.style.opacity=1-easedFade;
  }
  context.fillStyle='#02030a';
  context.fillRect(0,0,width,height);
  const expansion=1+2.4*time**3;
  for(const cloud of clouds){
   const x=width*(.5+cloud.x*expansion);
   const y=height*(.5+cloud.y*expansion);
   const radius=reach*cloud.size*expansion;
   const gradient=context.createRadialGradient(x,y,0,x,y,radius);
   gradient.addColorStop(0,'rgba('+cloud.color+',.42)');
   gradient.addColorStop(.4,'rgba('+cloud.color+',.22)');
   gradient.addColorStop(1,'rgba('+cloud.color+',0)');
   context.fillStyle=gradient;
   context.fillRect(x-radius,y-radius,radius*2,radius*2);
  }
  context.lineCap='round';
  const speed=.16*time+2.4*time**3;
  for(const {angle,phase,size} of particles){
   const progress=(phase+speed)%1;
   const radius=progress**2*reach;
   const tail=Math.max(0,radius*(1-.67*time**2*(1-easedFade))-1);
   const x=Math.cos(angle),y=Math.sin(angle);
   context.beginPath();
   context.moveTo(width/2+x*tail,height/2+y*tail);
   context.lineTo(width/2+x*radius,height/2+y*radius);
   context.strokeStyle='rgba(186,200,255,'+(.35+.65*progress)+')';
   context.lineWidth=size;
   context.stroke();
  }
  requestAnimationFrame(render);
 }
 requestAnimationFrame(render);
}
get('restart').onclick=()=>{
 get('page-four').hidden=true;
 next.closest('main').hidden=false;
 switching=false;
 step=0;
 draw();
 window.scrollTo(0,0);
 heading.focus({preventScroll:true});
};
next.onclick=()=>{
 if(switching)return;
 if(!selected[step].size){message.textContent='Select an option to continue.';options.firstChild.focus();return}
 if(step<2){goToStep(step+1);return}
 try{localStorage.setItem('chatPreferences',JSON.stringify({gender:[...selected[0]][0]||null,stories:[...selected[1]],artStyle:[...selected[2]][0],artStyles:[...selected[2]]}));message.textContent='Preferences saved.'}
 catch{message.textContent='Preferences confirmed for this session.'}
 enterPageFour();
};
draw();
</script></html>
